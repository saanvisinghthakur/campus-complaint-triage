<!DOCTYPE html>
<html>
<head>
  <title>Campus Complaint Portal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    textarea { width: 100%; height: 100px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; background: #e6f4ea; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>Campus Complaint Portal</h1>
  <p>Describe your complaint below. Our team will review and act on it shortly.</p>

  <textarea id="complaintText" placeholder="e.g. The water cooler on the 2nd floor hostel is leaking..."></textarea>
  <br>
  <button onclick="submitComplaint()">Submit Complaint</button>

  <div id="result"></div>

  <script>
    async function submitComplaint() {
      const text = document.getElementById("complaintText").value;
      if (!text) return alert("Please describe your complaint first.");

      const response = await fetch("/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });

      const data = await response.json();
      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.textContent = data.message;
      document.getElementById("complaintText").value = "";
    }
  </script>
</body>
</html>
