<!DOCTYPE html>
<html>
<head>
  <title>Campus Complaint Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a1830, #16305e, #2a4d8f);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .heading-wrap {
      max-width: 550px;
      margin: 30px auto 50px auto;
      text-align: center;
    }
    .heading-wrap h1 {
      font-size: 40px;
      color: white;
      margin: 0;
    }
    .wrapper { max-width: 550px; margin: 0 auto; }
    .card {
      background: white;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    h2 { color: #0f2044; font-size: 20px; margin-top: 0; }
    p.subtitle { color: #666; margin-bottom: 20px; }
    textarea {
      width: 100%; height: 110px; padding: 14px; font-size: 15px;
      border: 2px solid #e0e0e0; border-radius: 10px; resize: vertical; font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #1a3a6e; }
    input[type=text], input[type=email] {
      width: 100%; padding: 12px; font-size: 15px;
      border: 2px solid #e0e0e0; border-radius: 10px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    input[type=text]:focus, input[type=email]:focus { outline: none; border-color: #1a3a6e; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 14px;
      cursor: pointer;
      background: #1a3a6e;
      color: white;
      border: none;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: inherit;
    }
    button:hover:not(:disabled) { background: #14305c; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .track-toggle-btn {
      background: transparent !important;
      color: #1a3a6e !important;
      border: 2px solid #1a3a6e !important;
    }
    .track-toggle-btn:hover { background: #f0f4fa !important; }
    .spinner {
      width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result, #trackResult {
      margin-top: 18px; padding: 16px; border-radius: 8px; display: none;
    }
    .success { background: #e6f0ff; border-left: 4px solid #1a3a6e; color: #0f2044; }
    .error { background: #fdecea; border-left: 4px solid #d9534f; color: #7a1f1f; }
    .code { font-weight: bold; font-size: 18px; letter-spacing: 1px; }

    #trackCard { display: none; }
  </style>
</head>
<body>
  <div class="heading-wrap">
    <h1>📋 Campus Complaint Portal</h1>
  </div>

  <div class="wrapper">
    <div class="card">
      <p class="subtitle">Describe your complaint below. You'll receive a tracking ID once submitted.</p>

      <input type="text" id="studentName" placeholder="Full Name">
      <input type="text" id="rollNumber" placeholder="Roll Number">
      <input type="email" id="studentEmail" placeholder="Email">
      <textarea id="complaintText" placeholder="e.g. The water cooler on the 2nd floor hostel is leaking..."></textarea>
      <button id="submitBtn" onclick="submitComplaint()">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Submit Complaint</span>
      </button>
      <button class="track-toggle-btn" onclick="toggleTrack()">🔍 Track Your Complaint</button>

      <div id="result"></div>
    </div>

    <div class="card" id="trackCard">
      <h2>🔍 Track Your Complaint</h2>
      <p class="subtitle">Enter your tracking ID to check status.</p>
      <input type="text" id="trackCode" placeholder="e.g. C7X9K2">
      <button onclick="trackComplaint()">Check Status</button>
      <div id="trackResult"></div>
    </div>
  </div>

  <script>
    function toggleTrack() {
      var trackCard = document.getElementById("trackCard");
      trackCard.style.display = (trackCard.style.display === "none" || trackCard.style.display === "") ? "block" : "none";
    }

    async function submitComplaint() {
      var studentName = document.getElementById("studentName").value;
      var rollNumber = document.getElementById("rollNumber").value;
      var studentEmail = document.getElementById("studentEmail").value;
      var text = document.getElementById("complaintText").value;

      if (!studentName || !rollNumber || !studentEmail || !text) {
        alert("Please fill in all fields before submitting.");
        return;
      }

      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(studentEmail)) {
        alert("Please enter a valid email address (e.g. name@example.com).");
        return;
      }

      var btn = document.getElementById("submitBtn");
      var spinner = document.getElementById("spinner");
      var btnText = document.getElementById("btnText");
      var resultDiv = document.getElementById("result");

      btn.disabled = true;
      spinner.style.display = "inline-block";
      btnText.textContent = "Analyzing your complaint...";
      resultDiv.style.display = "none";

      try {
        var response = await fetch("/classify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student_name: studentName,
            roll_number: rollNumber,
            email: studentEmail,
            text: text
          })
        });

        var data = await response.json();
        resultDiv.className = "success";
        resultDiv.innerHTML = "✅ " + data.message + "<br>Your tracking ID: <span class='code'>" + data.code + "</span><br>Save this to check your complaint status later.";
        resultDiv.style.display = "block";
        document.getElementById("complaintText").value = "";
        document.getElementById("studentName").value = "";
        document.getElementById("rollNumber").value = "";
        document.getElementById("studentEmail").value = "";
      } catch (err) {
        resultDiv.className = "error";
        resultDiv.textContent = "❌ Something went wrong. Please try again.";
        resultDiv.style.display = "block";
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Submit Complaint";
      }
    }

    async function trackComplaint() {
      var code = document.getElementById("trackCode").value.trim();
      var trackResult = document.getElementById("trackResult");
      if (!code) {
        alert("Please enter a tracking ID.");
        return;
      }

      var response = await fetch("/track/" + code);
      var data = await response.json();

      trackResult.style.display = "block";
      if (data.error) {
        trackResult.className = "error";
        trackResult.textContent = data.error;
      } else {
        trackResult.className = "success";
        trackResult.innerHTML = "<strong>Status:</strong> " + data.status + "<br><strong>Category:</strong> " + data.category + (data.reply ? "<br><strong>Message from admin:</strong> " + data.reply : "");
      }
    }
  </script>
</body>
</html>
